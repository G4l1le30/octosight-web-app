services:
  # Caddy Reverse Proxy (SSL termination)
  caddy:
    image: caddy:2-alpine
    platform: linux/amd64
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks:
      octo-network:
        aliases:
          - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      network: host
      args:
        INTERNAL_API_URL: http://backend:8000
    image: octosight-web-app-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
      - next-cache:/app/.next:delegated
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - octo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: octosight-web-app-backend
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level debug
    env_file:
      - ./.env
    environment:
      - MYSQL_USER=octouser
      - MYSQL_PASSWORD=octopassword
      - MYSQL_DATABASE=octosight_db
      - MYSQL_HOST=db
      - WHITELIST_PATH=/app/data/whitelist.txt
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000,https://localhost,http://localhost
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8000)); s.close()\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    volumes:
      - ./backend:/app
    networks:
      - octo-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # MySQL Database
  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: octosight_db
      MYSQL_USER: octouser
      MYSQL_PASSWORD: octopassword
    ports:
      - "3307:3306"
    volumes:
      - octo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - octo-network
    command: ["mysqld", "--host-cache-size=0"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # Redis Cache
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    networks:
      - octo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "128M"

  # Celery Worker
  celery_worker:
    image: octosight-web-app-backend
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./ml:/ml
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=mysql+pymysql://octouser:octopassword@db:3306/octosight_db
      - SECRET_KEY=${SECRET_KEY}
      - ML_MODEL_PATH=ml/artifacts/model.pkl
      - ML_VECTORIZER_PATH=ml/artifacts/vectorizer.pkl
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - octo-network
    healthcheck:
      disable: true
    restart: unless-stopped

  # Celery Beat
  celery_beat:
    image: octosight-web-app-backend
    command: celery -A celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
      - ./ml:/ml
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=mysql+pymysql://octouser:octopassword@db:3306/octosight_db
      - SECRET_KEY=${SECRET_KEY}
      - ML_MODEL_PATH=ml/artifacts/model.pkl
      - ML_VECTORIZER_PATH=ml/artifacts/vectorizer.pkl
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - octo-network
    healthcheck:
      disable: true
    restart: unless-stopped

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_USER=octouser
      - PMA_PASSWORD=octopassword
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - octo-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "128M"

networks:
  octo-network:
    driver: bridge

volumes:
  octo-db-data:
  caddy-data:
  caddy-config:
  next-cache:
  frontend_node_modules:
